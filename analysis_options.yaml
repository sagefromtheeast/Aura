# analysis_options.yaml — Aura
# Configures Dart analyzer and linter for the Aura project.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Exclude Drift and freezed generated files — not maintainer code.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/native/audio_engine_bindings.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true

linter:
  rules:
    avoid_print: false           # debugPrint used intentionally in main.dart
    prefer_single_quotes: true
    always_declare_return_types: true
    prefer_const_constructors: true
    prefer_final_fields: true
