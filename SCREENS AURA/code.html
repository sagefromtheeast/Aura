<style>
        /* Custom Liquid Glass & Gradient Animation */
        .splash-bg {
            background: linear-gradient(135deg, #FF8F6D 0%, #4A154B 100%);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .liquid-overlay {
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 50%, transparent 100%);
        }

        /* Float animation for the logo */
        .float-anim {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        /* Entrance animations */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .fade-in {
            opacity: 0;
            animation: fadeIn 1.2s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
        
        /* Hide scrollbars for full screen effect */
        body {
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
    </style>

<body class="bg-background antialiased h-screen w-screen overflow-hidden text-on-surface font-body-md">
<!-- Splash Screen Container -->
<main class="relative w-full h-full splash-bg flex flex-col items-center justify-between px-6 pb-12 pt-24 overflow-hidden">
<!-- Glassmorphism Blur Overlay -->
<div class="absolute inset-0 w-full h-full liquid-overlay z-0 mix-blend-overlay"></div>
<!-- Ambient Depth Layers -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-container rounded-full mix-blend-multiply filter blur-[80px] opacity-60 animate-pulse"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-primary rounded-full mix-blend-multiply filter blur-[100px] opacity-50"></div>
<!-- Top spacing for visual balance, pushing content to middle -->
<div class="flex-1"></div>
<!-- Center Content: Logo & Tagline -->
<div class="relative z-10 flex flex-col items-center justify-center flex-[2] w-full max-w-sm mx-auto">
<!-- Logo Container -->
<div class="relative mb-relationship-tight fade-in float-anim delay-100">
<!-- Outer Glow -->
<div class="absolute inset-0 bg-primary-container rounded-full blur-2xl opacity-40 scale-110"></div>

                Aura

                Your music, more alive.

<!-- Bottom Action Area (Thumb Zone) -->
<div class="relative z-10 w-full max-w-sm mx-auto pb-safe flex flex-col items-center justify-end flex-1">
<!-- Primary Button (Liquid Material Style) -->
<button class="w-full h-touch-target-min bg-primary rounded-full flex items-center justify-center relative overflow-hidden group fade-in-up delay-[700ms] shadow-[0_8px_24px_-6px_rgba(156,67,39,0.5)] active:scale-95 transition-transform duration-200">
<!-- Inner Glass Border -->
<div class="absolute inset-0 rounded-full border border-white/20 pointer-events-none"></div>

                    Get Started
                    <span class="material-symbols-outlined text-[24px] font-variation-settings-'FILL'-0">
                        arrow_forward
                    </span>
</span>

</button>
<!-- Subtle secondary indicator/text if needed (Optional, keeping clean per prompt) -->
<p class="mt-relationship-tight font-caption-sm text-caption-sm text-white/60 text-center fade-in delay-[900ms]">
                By continuing, you agree to our terms.
            </p>
</div>
</main>
<script>
        // Simple haptic feedback simulation and interaction
        document.querySelector('button').addEventListener('click', function(e) {
            // Trigger visual active state
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
                // In a real app, this would navigate to the next screen
                console.log('Transition to Dashboard/Library');
            }, 150);
            
            // If running in a webview that supports vibration API
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        });
    </script>
